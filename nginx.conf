server {
    listen 80;

    # 从Dockerfile复制进来的目录中返回Vue页面。
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 把前端的/api请求转发给Docker Compose中的后端服务。
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 关闭缓存，使大模型生成的内容能够及时流式返回前端。
        proxy_buffering off;
        proxy_cache off;
    }
}
