server {
    listen 80;

    # 返回Vue页面并支持前端路由回退。
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 将/api请求代理到后端容器。
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 禁用缓冲以实时传输模型输出。
        proxy_buffering off;
        proxy_cache off;
    }
}
